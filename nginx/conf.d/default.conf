server {
    listen 80;
    server_name localhost;

    # Docker's internal DNS resolver — forces re-resolution on each request
    # so container restarts don't break upstream routing
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── Auth Service (port 8000) ─────────────────────────────────────────────
    location /api/auth/ {
        set $auth_upstream http://tunisia_auth:8000;
        proxy_pass         $auth_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/admin/ {
        set $auth_upstream http://tunisia_auth:8000;
        proxy_pass         $auth_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Provider Service (port 8002) — /api/v1/ ─────────────────────────────
    location /api/v1/ {
        set $provider_upstream http://tunisia_provider:8002;
        proxy_pass         $provider_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── AI Service (port 8003) — /api/ai/ ───────────────────────────────────
    location /api/ai/ {
        set $ai_upstream http://tunisia_ai:8003;
        proxy_pass         $ai_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 150s;
    }

    # ─── Booking Service (port 8001) ──────────────────────────────────────────
    location ~ ^/api/(bookings|availability) {
        set $booking_upstream http://tunisia_booking:8001;
        proxy_pass         $booking_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Fallback → Auth Service ──────────────────────────────────────────────
    location / {
        set $auth_upstream http://tunisia_auth:8000;
        proxy_pass         $auth_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
